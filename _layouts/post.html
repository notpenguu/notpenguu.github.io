---
layout: default
---
<article class="post">
  <h1 class="post-title">{{ page.title }}</h1>
  <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.tags %} · {{ page.tags | join: ", " }}{% endif %}</p>
  <div class="post-body">
    <div class="toc" id="toc" hidden></div>
    {{ content }}
  </div>
  <p class="back-link"><a href="{{ '/' | relative_url }}">← Back to all posts</a></p>
</article>
<script src="{{ '/assets/toc.js' | relative_url }}" defer></script>
